services:
  - type: web
    name: ibvap-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    autoDeploy: true
    envVars:
      - key: IBVAP_MOCK_AI
        value: "true"
      - key: IBVAP_ANALYSIS_FPS
        value: "2"
      - key: FCR_MATCH_THRESHOLD
        value: "0.55"
      - key: PYTHONUNBUFFERED
        value: "1"
